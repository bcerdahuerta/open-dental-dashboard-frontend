name: Node - Prod validation

# Controls when the action will run.
# Production deployment is owned by Vercel auto-deploy on pushes to main.
# This legacy GitHub Actions workflow is validation-only; SSH deploy is disabled.
on:
  # Runs PR tests for main and validates pushes to main before Vercel serves the app.
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main

jobs:
  pr_tests:
    if: github.event_name == 'pull_request'
    name: ✅ PR tests
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 🔬 Run tests and Vercel/root build
        working-directory: full-version
        run: |
          npm ci
          npm test
          npm run build

  main_validation:
    if: github.event_name == 'push'
    name: ✅ Main validation (Vercel deploys production)
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 🔨 Validate Vercel/root build
        working-directory: full-version
        run: |
          npm ci
          npm test
          npm run build
