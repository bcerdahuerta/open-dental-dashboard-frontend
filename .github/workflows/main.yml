name: Node - Stage deploy

# Controls when the action will run.
on:
  # Runs PR tests for stage branches and deploys only on pushes to stage branches.
  push:
    branches:
      - stage*
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - stage*

jobs:
  pr_tests:
    if: github.event_name == 'pull_request'
    name: ✅ PR tests
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 🔬 Run tests and stage build
        working-directory: full-version
        run: |
          npm ci
          npm test
          npm run build-stage

  if_merged:
    if: github.event_name == 'push'
    name: 🎉 Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 🔨 Build Project
        working-directory: full-version
        run: |
          npm ci
          npm test
          npm run build-stage

      - name: 📂 Deploy to Server
        uses: easingthemes/ssh-deploy@v4
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          # ARGS: "-rltgoDzvO --delete"
          SOURCE: "full-version/dist/"
          REMOTE_HOST: 145.79.3.173
          REMOTE_USER: u965251139
          REMOTE_PORT: "65002"
          TARGET: domains/berrydashboard.com/public_html/vue/stage
          EXCLUDE: "/full-version/node_modules/"
